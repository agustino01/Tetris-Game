<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg: #0a0e1a;
    --panel: #0f1526;
    --border: #1e2a4a;
    --ink: #d6def5;
    --dim: #5f6f9e;
    --accent: #7ad1ff;
    --I: #3fd6ff;
    --O: #ffe066;
    --T: #c17bff;
    --S: #6fe86f;
    --Z: #ff6b6b;
    --J: #6b8bff;
    --L: #ffab4c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', Courier, monospace;
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    padding: env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px);
  }
  .eyebrow{
    letter-spacing: 0.35em;
    font-size: 10px;
    color: var(--dim);
    margin-top: 8px;
    text-transform: uppercase;
  }
  h1{
    font-size: 26px;
    margin: 4px 0 8px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(122,209,255,0.35);
  }
  #mainArea{
    display:flex;
    gap: 10px;
    width:100%;
    max-width: 420px;
    justify-content:center;
  }
  #boardWrap{
    position:relative;
    width: 66%;
    aspect-ratio: 10/20;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  canvas#board{ display:block; width:100%; height:100%; }
  #side{
    width: 34%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .box{
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    text-align:center;
  }
  .box .label{ font-size:9px; color:var(--dim); letter-spacing:1px; margin-bottom:4px; }
  .box .value{ font-size:15px; color:var(--ink); font-weight:bold; }
  #nextCanvasWrap{ aspect-ratio:1/1; }
  canvas#next{ width:100%; height:100%; }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(10,14,26,0.92);
    text-align:center;
    padding: 16px;
    gap: 12px;
    z-index: 5;
  }
  #overlay h2{ margin:0; font-size:18px; color:var(--accent); letter-spacing:1px; }
  #overlay p{ margin:0; font-size:12px; color:var(--dim); line-height:1.6; max-width:220px; }
  button.play{
    background: var(--accent);
    color: #0a0e1a;
    border:none;
    font-family:inherit;
    font-weight:bold;
    font-size:14px;
    letter-spacing:1px;
    padding: 10px 24px;
    border-radius: 8px;
    cursor:pointer;
  }
  button.play:active{ transform: scale(0.97); }
  #controls{
    margin-top: 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    max-width:420px;
  }
  #dpad{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:8px;
  }
  #dpad button, #dropBtn{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 18px;
    border-radius: 10px;
    padding: 14px 0;
    display:flex; align-items:center; justify-content:center;
  }
  #dpad button:active, #dropBtn:active{ background:#182242; }
  #dropBtn{ width:100%; font-size:13px; letter-spacing:1px; color:var(--ink); }
  .credit{ margin-top:10px; font-size:11px; letter-spacing:1px; color:var(--dim); }
</style>
</head>
<body>
  <div class="eyebrow">consola retro</div>
  <h1>TETRIS</h1>
  <div id="mainArea">
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="overlay">
        <h2>Toca para empezar</h2>
        <p>Usá los botones para mover y girar. Encajá las líneas completas.</p>
        <button class="play" id="playBtn">Jugar</button>
      </div>
    </div>
    <div id="side">
      <div class="box"><div class="label">PUNTOS</div><div class="value" id="score">0</div></div>
      <div class="box"><div class="label">LÍNEAS</div><div class="value" id="lines">0</div></div>
      <div class="box"><div class="label">NIVEL</div><div class="value" id="level">1</div></div>
      <div class="box" id="nextCanvasWrap">
        <div class="label">SIGUIENTE</div>
        <canvas id="next"></canvas>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="dropBtn">⬇ CAÍDA RÁPIDA</button>
    <div id="dpad">
      <button data-act="left">◀</button>
      <button data-act="rotate">⟳</button>
      <button data-act="right">▶</button>
    </div>
  </div>
  <div class="credit">Creado por Agustino López</div>

<script>
(function(){
  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById('board');
  const bctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const boardWrap = document.getElementById('boardWrap');
  const nextWrap = document.getElementById('nextCanvasWrap');

  const COLORS = {
    I:'#3fd6ff', O:'#ffe066', T:'#c17bff', S:'#6fe86f', Z:'#ff6b6b', J:'#6b8bff', L:'#ffab4c'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const KEYS = Object.keys(SHAPES);

  let cell, grid, cur, curType, nextType, score, lines, level, running, dropTimer, dropMs;

  function resize(){
    const w = boardWrap.clientWidth, h = boardWrap.clientHeight;
    boardCanvas.width = w * devicePixelRatio;
    boardCanvas.height = h * devicePixelRatio;
    bctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    cell = w / COLS;

    const nw = nextWrap.clientWidth, nh = nextWrap.clientHeight;
    nextCanvas.width = nw * devicePixelRatio;
    nextCanvas.height = nh * devicePixelRatio;
    nctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    draw();
    drawNext();
  }
  window.addEventListener('resize', resize);

  function emptyGrid(){
    return Array.from({length:ROWS}, ()=>Array(COLS).fill(null));
  }

  function randomType(){ return KEYS[Math.floor(Math.random()*KEYS.length)]; }

  function spawn(){
    curType = nextType || randomType();
    nextType = randomType();
    const shape = SHAPES[curType].map(([x,y])=>[x,y]);
    cur = { type: curType, cells: shape, x: 3, y: -1 };
    if(collides(cur.cells, cur.x, cur.y)){
      return gameOver();
    }
    drawNext();
  }

  function collides(cells, ox, oy){
    for(const [cx,cy] of cells){
      const x = ox+cx, y = oy+cy;
      if(x<0||x>=COLS||y>=ROWS) return true;
      if(y>=0 && grid[y][x]) return true;
    }
    return false;
  }

  function merge(){
    for(const [cx,cy] of cur.cells){
      const x = cur.x+cx, y = cur.y+cy;
      if(y>=0) grid[y][x] = cur.type;
    }
  }

  function clearLines(){
    let cleared = 0;
    for(let y=ROWS-1; y>=0; y--){
      if(grid[y].every(c=>c)){
        grid.splice(y,1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if(cleared){
      const points = [0,100,300,500,800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines/10);
      dropMs = Math.max(120, 700 - (level-1)*55);
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
      restartTimer();
    }
  }

  function rotate(cells){
    // rotate around approximate center (1,1) for a 3x3/4x4 box
    return cells.map(([x,y])=>[1 - (y-1), 1 + (x-1)]);
  }

  function tryRotate(){
    if(!running) return;
    const rotated = rotate(cur.cells);
    for(const kick of [0,-1,1,-2,2]){
      if(!collides(rotated, cur.x+kick, cur.y)){
        cur.cells = rotated;
        cur.x += kick;
        draw();
        return;
      }
    }
  }

  function tryMove(dx){
    if(!running) return;
    if(!collides(cur.cells, cur.x+dx, cur.y)){
      cur.x += dx;
      draw();
    }
  }

  function softDrop(){
    if(!running) return;
    if(!collides(cur.cells, cur.x, cur.y+1)){
      cur.y += 1;
    } else {
      merge();
      clearLines();
      spawn();
    }
    draw();
  }

  function hardDrop(){
    if(!running) return;
    while(!collides(cur.cells, cur.x, cur.y+1)){
      cur.y += 1;
      score += 1;
    }
    merge();
    clearLines();
    spawn();
    scoreEl.textContent = score;
    draw();
  }

  function drawCell(ctx, x, y, size, color){
    const pad = size*0.06;
    ctx.fillStyle = color;
    const r = size*0.18;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x+pad, y+pad, size-pad*2, size-pad*2, r);
    else ctx.rect(x+pad,y+pad,size-pad*2,size-pad*2);
    ctx.fill();
  }

  function draw(){
    const w = boardWrap.clientWidth, h = boardWrap.clientHeight;
    bctx.clearRect(0,0,w,h);
    // grid lines
    bctx.strokeStyle = 'rgba(122,209,255,0.05)';
    for(let i=1;i<COLS;i++){
      bctx.beginPath(); bctx.moveTo(i*cell,0); bctx.lineTo(i*cell,h); bctx.stroke();
    }
    for(let j=1;j<ROWS;j++){
      bctx.beginPath(); bctx.moveTo(0,j*cell); bctx.lineTo(w,j*cell); bctx.stroke();
    }
    // settled blocks
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(grid[y][x]) drawCell(bctx, x*cell, y*cell, cell, COLORS[grid[y][x]]);
      }
    }
    // current piece
    if(cur){
      for(const [cx,cy] of cur.cells){
        const gx = cur.x+cx, gy = cur.y+cy;
        if(gy>=0) drawCell(bctx, gx*cell, gy*cell, cell, COLORS[cur.type]);
      }
    }
  }

  function drawNext(){
    const w = nextWrap.clientWidth, h = nextWrap.clientHeight - 14;
    nctx.clearRect(0,0,w,h+14);
    if(!nextType) return;
    const shape = SHAPES[nextType];
    const size = Math.min(w,h)/4.2;
    const offX = (w - size*4)/2;
    const offY = 14 + (h - size*2)/2;
    for(const [x,y] of shape){
      drawCell(nctx, offX + x*size, offY + y*size, size, COLORS[nextType]);
    }
  }

  function restartTimer(){
    clearInterval(dropTimer);
    dropTimer = setInterval(softDrop, dropMs);
  }

  function gameOver(){
    running = false;
    clearInterval(dropTimer);
    overlay.querySelector('h2').textContent = 'Juego terminado';
    overlay.querySelector('p').textContent = `Puntos: ${score} · Líneas: ${lines}. Tocá para intentar de nuevo.`;
    playBtn.textContent = 'Reintentar';
    overlay.style.display = 'flex';
  }

  function start(){
    grid = emptyGrid();
    score = 0; lines = 0; level = 1; dropMs = 700;
    scoreEl.textContent = 0; linesEl.textContent = 0; levelEl.textContent = 1;
    nextType = randomType();
    spawn();
    running = true;
    overlay.style.display = 'none';
    restartTimer();
    draw();
  }

  playBtn.addEventListener('click', start);

  document.querySelectorAll('#dpad button').forEach(btn=>{
    const act = btn.dataset.act;
    const fn = act==='left' ? ()=>tryMove(-1) : act==='right' ? ()=>tryMove(1) : tryRotate;
    btn.addEventListener('touchstart', e=>{ e.preventDefault(); fn(); });
    btn.addEventListener('click', fn);
  });
  const dropBtn = document.getElementById('dropBtn');
  dropBtn.addEventListener('touchstart', e=>{ e.preventDefault(); hardDrop(); });
  dropBtn.addEventListener('click', hardDrop);

  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowLeft') tryMove(-1);
    else if(e.key==='ArrowRight') tryMove(1);
    else if(e.key==='ArrowDown') softDrop();
    else if(e.key==='ArrowUp') tryRotate();
    else if(e.key===' ') hardDrop();
  });

  // swipe on board: left/right move, down = soft, up-swipe = rotate, tap = rotate
  let touchStart = null;
  boardWrap.addEventListener('touchstart', (e)=>{
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()};
  }, {passive:true});
  boardWrap.addEventListener('touchend', (e)=>{
    if(!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const dt = Date.now() - touchStart.t;
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24){
      if(dt < 300) tryRotate();
    } else if(Math.abs(dx) > Math.abs(dy)){
      tryMove(dx>0?1:-1);
    } else if(dy > 0){
      if(dy > 100) hardDrop(); else softDrop();
    }
    touchStart = null;
  });

  grid = emptyGrid();
  resize();
})();
</script>
</body>
</html>
